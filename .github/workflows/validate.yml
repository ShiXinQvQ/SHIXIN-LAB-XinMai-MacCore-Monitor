name: Validate

on:
  push:
    branches:
      - main
      - "codex/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-validation:
    name: Release validation
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Show Swift toolchain
        run: swift --version

      - name: Audit public source
        run: Scripts/audit-public-source.sh

      - name: Validate metadata, localizations, and scripts
        run: |
          plutil -lint \
            Packaging/Info.plist \
            Packaging/com.shixinqvq.shixinlab.macstresspower.helper.plist \
            Sources/ShixinStressPower/Resources/zh-Hans.lproj/Localizable.strings \
            Sources/ShixinStressPower/Resources/en.lproj/Localizable.strings \
            Sources/ShixinStressPower/Resources/ja.lproj/Localizable.strings
          bash -n Scripts/audit-public-source.sh Scripts/build-app.sh Scripts/release-public-beta.sh
          git diff --check

      - name: Build app and Helper
        run: |
          swift build -c release --product ShixinStressPower
          swift build -c release --product ShixinStressPowerHelper

      - name: Run non-stress self-test
        run: swift run -c release ShixinStressPowerSelfTest --core-only
